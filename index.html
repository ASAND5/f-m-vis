<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abrar's Watched</title>

<style>
  :root { --g: rgba(120,120,125,.4); --bh: 38vh; }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font: 14px/1.35 "Cambria", Georgia, serif;
    overflow: hidden;
  }
  canvas { display: block; touch-action: none; }

  /* ---- panels ---- */
  .p {
    position: fixed;
    top: 5px;
    bottom: 5px;
    width: 300px;
    padding: 22px;
    border-radius: 14px;
    background: var(--g);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    overflow: auto;
    z-index: 5;
  }
  #L { left: 5px; }
  #R {
    right: 5px;
    bottom: auto;
    max-height: calc(100% - 10px);
    transform: translateX(120%);
    transition: transform .35s;
  }
  #R.on { transform: none; }

  h1 { font-size: 17px; margin: 0 0 16px; font-weight: 600; }
  h2 { font-size: 12px; margin: 22px 0 6px; opacity: .65; font-weight: 500; }
  .big { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -2px; }
  .q { margin-top: 14px; opacity: .7; font-size: 13px; }

  .r {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 3px 0;
    cursor: pointer;
  }
  .r:hover { opacity: .65; }

    /* ---- bottom links ---- */
  #K {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 16px;
    border-radius: 10px;
    background: var(--g);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  #K a { color: #fff; text-decoration: none; opacity: .85; }
  #K a:hover { opacity: 1; text-decoration: underline; }
  #K i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #777);
  }

  /* ---- search ---- */
  #S {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: max(200px, min(420px, calc(100% - 660px)));
    z-index: 6;
  }
  #S input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 0;
    background: var(--g);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: #fff;
    font: inherit;
    outline: 0;
  }
  #S input::placeholder { color: #ddd; }
  #res {
    margin-top: 4px;
    border-radius: 12px;
    background: rgba(90,90,95,.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    max-height: 60vh;
    overflow: auto;
  }
  #res h2 { margin: 8px 14px 2px; }
  #res .r { padding: 5px 14px; }

  /* ---- buttons ---- */
  .bt {
    position: fixed;
    bottom: 12px;
    z-index: 5;
    padding: 9px 14px;
    border: 0;
    border-radius: 10px;
    background: var(--g);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  #B { left: 315px; }
  #Z {
    position: fixed;
    right: 12px;
    bottom: 12px;
    z-index: 5;
    display: flex;
    gap: 8px;
    transition: right .3s;
  }
  #Z .bt { position: static; width: 40px; padding: 9px 0; font-size: 18px; line-height: 1; }
  #Z.sh { right: 315px; }

  /* ---- labels in the 3D scene ---- */
  .lb {
    position: fixed;
    left: 0;
    top: 0;
    font-size: 11px;
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 0 4px #000, 0 0 2px #000;
  }
  .ly { font-size: 13px; font-weight: 600; }

    /* ---- links text (only needed if you use the "Developed by:" span version) ---- */
  #K span { opacity: .7; }
  #K span a { opacity: 1; }

  /* ---- mid-size windows: shrink the bottom links ---- */
  @media (max-width: 1100px) {
    #K { font-size: 12px; padding: 7px 12px; gap: 8px; }
  }

  /* ---- phones and narrow screens ---- */
  @media (max-width: 900px) {
    #S { width: calc(100% - 24px); }
    .p {
      top: auto;
      bottom: 46px;
      left: 5px;
      right: 5px;
      width: auto;
      height: var(--bh);
      padding: 14px;
    }
    #L { display: flex; gap: 28px; overflow-x: auto; overflow-y: hidden; }
    #L .t, #L .o { flex: 0 0 min(260px, 72vw); max-height: 100%; overflow-y: auto; }
    #R {
      top: auto;
      bottom: 46px;
      left: 5px;
      right: 5px;
      width: auto;
      max-height: none;
      transform: translateY(120%);
    }
    #R.on { transform: none; }
    .det #L { display: none; }
    #B { left: 12px; bottom: calc(var(--bh) + 53px); }
    #Z { right: 12px; bottom: calc(var(--bh) + 53px); }
    #K {
      bottom: 6px;
      max-width: calc(100% - 12px);
      flex-wrap: wrap;
      justify-content: center;
      font-size: 11px;
      padding: 6px 10px;
      gap: 8px;
    }
  }
</style>
</head>

<body>
<div id="L" class="p"></div>
<div id="R" class="p"></div>
<div id="S"><input id="q" autocomplete="off"><div id="res"></div></div>
<button id="B" class="bt">Recalibrate</button>
<div id="Z">
  <button id="zi" class="bt" aria-label="Zoom in">+</button>
  <button id="zo" class="bt" aria-label="Zoom out">&minus;</button>
<div id="K">
  <span>Developed by: <a href="https://asand5.github.io/Portfolio/" target="_blank" rel="noopener">Md Abrar Hasin Parash</a></span>
  <i></i>
  <a href="https://letterboxd.com/bored_man_Ab/" target="_blank" rel="noopener">Letterboxd</a>
</div>
</div>
<div id="lbs"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ======================= SETTINGS (edit these) =======================
const CFG = {
  title: "Abrar's Watched",
  quote: "Was never meant to be a cinephile but watched too many films anyways.",
  ph: "Search films, directors, cast, languages",
  file: "watched.csv",
  fontUrl: "https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&display=swap",
  font: "Cambria,Caladea,Georgia,serif",
  movieColor: "#80b900",
  peopleColor: "#b5dbec",
  sphere: [9, 24, 16]          // radius, width segments, height segments
};

// ======================= HELPERS =======================
const $ = id => document.getElementById(id);
const narrow = () => matchMedia('(max-width:900px)').matches;

const esc = s => String(s).replace(/[&<>"]/g, c => '&#' + c.charCodeAt(0) + ';');
const nm  = s => (s || '').trim().replace(/\s+/g, ' ');
const key = s => nm(s).toLowerCase();
const nz  = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

// Reads CSV text into rows of cells (handles quoted cells and commas inside quotes)
function csv(t) {
  const rows = [];
  let row = [], cell = '', quoted = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (quoted) {
      if (ch == '"') {
        if (t[i + 1] == '"') { cell += '"'; i++; }
        else quoted = false;
      } else cell += ch;
    } else if (ch == '"') {
      quoted = true;
    } else if (ch == ',') {
      row.push(cell); cell = '';
    } else if (ch == '\n' || ch == '\r') {
      if (ch == '\r' && t[i + 1] == '\n') i++;
      row.push(cell); cell = '';
      rows.push(row); row = [];
    } else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.join('').trim());
}

// Parses dates: dd/mm/yyyy, yyyy-mm-dd, or just yyyy. n is used for sorting.
function pd(s) {
  s = (s || '').trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return { y: m[3], n: +m[3] * 1e4 + m[2] * 100 + +m[1] };
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return { y: m[1], n: +m[1] * 1e4 + m[2] * 100 + +m[3] };
  m = s.match(/^\d{4}$/);
  return m ? { y: s, n: +s * 1e4 } : null;
}

// Sorts by count (high first), then name; keeps everyone tied for 3rd place
const rank = (a, c, f) => {
  a = [...a].sort((x, y) => c(y) - c(x) || f(x).localeCompare(f(y)));
  const t = a[2] ? c(a[2]) : 0;
  return a.filter(x => c(x) >= t);
};

// ======================= PAGE SETUP =======================
document.title = CFG.title;
if (CFG.fontUrl) {
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = CFG.fontUrl;
  document.head.append(l);
}
document.body.style.fontFamily = CFG.font;
$('q').placeholder = CFG.ph;

fetch(CFG.file)
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(init)
  .catch(err => {
    console.error(err);
    $('L').innerHTML = '<h1>Could not load</h1>' + esc(String(err.message || err)) +
      '<br><br>Expected <b>' + esc(CFG.file) + '</b> next to index.html, served over http(s).';
  });

// ======================= MAIN =======================
function init(txt) {

  // ---------- 1. READ THE CSV ----------
  const R0 = csv(txt.replace(/^\uFEFF/, ''));
  if (!R0.length) throw new Error('The CSV file is empty');
  const hd = R0[0].map(h => h.trim().toLowerCase());
  const ix = h => hd.indexOf(h);
  if (ix('title') < 0 && ix('name') < 0) {
    throw new Error('No "title" or "name" column found. Columns seen: ' + hd.join(' | '));
  }

  const N = [];                         // every dot
  const M = [new Map(), new Map(), new Map()];   // lookup per layer
  const F = [];                         // films
  const E = [];                         // lines (pairs of dot indexes)
  const LG = new Map();                 // languages
  // layers: 0 = directors, 1 = films, 2 = cast

  const mk = (t, name) => ({ t, name, i: N.length, nb: [], f: [] });

  const person = (t, name) => {
    const k = key(name);
    let n = M[t].get(k);
    if (!n) {
      n = mk(t, nm(name));
      N.push(n);
      M[t].set(k, n);
    }
    return n;
  };

  const link = (a, b) => {
    a.nb.push(b);
    b.nb.push(a);
    E.push([a.i, b.i]);
  };

  R0.slice(1).forEach(r => {
    const g = h => ix(h) < 0 ? '' : r[ix(h)] || '';
    const title = nm(g('title') || g('name'));
    if (!title) return;

    const d = pd(g('year'));
    const lang = nm(g('language'));
    const fn = mk(1, title);
    const f = {
      title,
      y: d ? d.y : nm(g('year')),
      n: d ? d.n : 0,
      lang,
      node: fn,
      dirs: [],
      cast: []
    };
    fn.film = f;
    N.push(fn);
    F.push(f);

    if (lang) {
      const k = key(lang);
      if (!LG.has(k)) LG.set(k, { name: lang, k, fs: [] });
      LG.get(k).fs.push(f);
    }

    // directors: several names in one cell, split by , ; or |
    g('director').split(/[,;|]/).map(nm).filter(Boolean).forEach(x => {
      const p = person(0, x);
      if (!f.dirs.includes(p)) {
        f.dirs.push(p);
        p.f.push(f);
        link(fn, p);
      }
    });

    // cast: add more column names here if you add more cast columns
    ['cast', 'cast1', 'cast2', 'cast3'].map(g)
      .flatMap(s => s.split(/[,;|]/)).map(nm).filter(Boolean)
      .forEach(x => {
        const p = person(2, x);
        if (!f.cast.includes(p)) {
          f.cast.push(p);
          p.f.push(f);
          link(fn, p);
        }
      });
  });

  console.log('columns:', hd, 'films:', F.length,
    'directors:', N.filter(n => n.t == 0).length,
    'cast:', N.filter(n => n.t == 2).length, 'links:', E.length);
  if (!F.length) {
    $('L').innerHTML = '<h1>No films found</h1>The CSV has a header row but no rows with a title.';
    return;
  }
  if (!E.length) console.warn('No director/cast links. Check your CSV headers: director, cast, cast1, cast2, cast3');

  // ---------- 2. LAYOUT ----------
  let sd = 7;                                            // fixed seed = same layout every time
  const rnd = () => (sd = sd * 16807 % 2147483647) / 2147483647;

  const P = [0, 1, 2].map(t => N.filter(n => n.t == t)); // dots per layer
  const Rd = P.map(a => 30 * Math.sqrt(a.length || 1));  // <-- EDIT: 15 = spacing between spheres
  const Rm = Math.max(...Rd);
  const GAP = .3 * Rm + 40;                              // <-- EDIT: distance between the layers
  const Y = [GAP, 0, -GAP];

  N.forEach(n => {
    const a = rnd() * 6.283, r = Math.sqrt(rnd());
    n.u = Math.cos(a) * r;
    n.v = Math.sin(a) * r;
  });

  for (let it = 0; it < 40; it++) {                      // <-- EDIT: 40 = relaxation rounds
    // pull each dot toward the average position of its neighbours
    N.forEach(n => {
      let a = 0, b = 0;
      n.nb.forEach(m => { a += m.u; b += m.v; });
      n.tu = n.nb.length ? a / n.nb.length : n.u;
      n.tv = n.nb.length ? b / n.nb.length : n.v;
    });
    // spread evenly: radius by distance rank, angle by angle rank
    //P.forEach(a => {
      //const c = a.length;
      //a.sort((x, y) => Math.hypot(x.tu, x.tv) - Math.hypot(y.tu, y.tv));
      //a.forEach((p, i) => { p.rk = Math.sqrt((i + .5) / c); });
   //   a.sort((x, y) => Math.atan2(x.tv, x.tu) - Math.atan2(y.tv, y.tu));
     // a.forEach((p, i) => {
      //  const an = 2 * Math.PI * (i + .5) / c;
       // p.u = Math.cos(an) * p.rk;
        //p.v = Math.sin(an) * p.rk;
      //});
    //});
        P.forEach(a => {
      const c = a.length;
      if (!c) return;
      const golden = 2.399963229728653;

      // 1. fixed spiral slots (radius grows with index, angle by golden angle, range -PI..PI)
      const slots = [];
      for (let i = 0; i < c; i++) {
        slots.push({
          r: Math.sqrt((i + .5) / c),
          an: ((i * golden + Math.PI) % (2 * Math.PI)) - Math.PI
        });
      }

      // 2. dots sorted by how central their neighbours are (closest to centre first)
      a.sort((x, y) => Math.hypot(x.tu, x.tv) - Math.hypot(y.tu, y.tv));

      // 3. cut into bands; inside each band, match dots to slots by angle order
      const bands = Math.max(1, Math.round(Math.sqrt(c / 3)));
      for (let b = 0; b < bands; b++) {
        const lo = Math.floor(b * c / bands);
        const up = Math.floor((b + 1) * c / bands);
        const dots = a.slice(lo, up).sort((x, y) => Math.atan2(x.tv, x.tu) - Math.atan2(y.tv, y.tu));
        const spots = slots.slice(lo, up).sort((x, y) => x.an - y.an);
        dots.forEach((p, j) => {
          p.rk = spots[j].r;
          p.u = Math.cos(spots[j].an) * spots[j].r;
          p.v = Math.sin(spots[j].an) * spots[j].r;
        });
      }
    });
  }
  N.forEach(n => {
    n.x = n.u * Rd[n.t];
    n.z = n.v * Rd[n.t];
    n.y = Y[n.t];
  });

  // ---------- 3. 3D SCENE ----------
  const sc = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, .5, 6000);
  const ren = new THREE.WebGLRenderer({ antialias: true });
  ren.setSize(innerWidth, innerHeight);
  ren.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.prepend(ren.domElement);

  const G = new THREE.Group();
  sc.add(G);

  // spheres
  const im = new THREE.InstancedMesh(new THREE.SphereGeometry(...CFG.sphere), new THREE.MeshBasicMaterial(), N.length);
  const m4 = new THREE.Matrix4();
  const col = new THREE.Color();
  const base = N.map(n => new THREE.Color(n.t == 1 ? CFG.movieColor : CFG.peopleColor));
  N.forEach((n, i) => {
    m4.setPosition(n.x, n.y, n.z);
    im.setMatrixAt(i, m4);
  });
  im.frustumCulled = false;
  G.add(im);

  // lines
  const pos = new Float32Array(E.length * 6);
  const lc = new Float32Array(E.length * 6).fill(.28);   // <-- EDIT: .28 = normal line brightness
  E.forEach((e, k) => {
    const a = N[e[0]], b = N[e[1]];
    pos.set([a.x, a.y, a.z, b.x, b.y, b.z], k * 6);
  });
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  lg.setAttribute('color', new THREE.BufferAttribute(lc, 3));
  const lines = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ vertexColors: true }));
  lines.frustumCulled = false;
  G.add(lines);

  // highlight: selected dot + neighbours bright, everything else dim
  let hi = -1;
  function paint() {
    const s = new Set(hi < 0 ? [] : [hi, ...N[hi].nb.map(m => m.i)]);
    N.forEach((n, i) => {
      col.copy(base[i]).multiplyScalar(hi < 0 || s.has(i) ? 1 : .18);
      im.setColorAt(i, col);
    });
    im.instanceColor.needsUpdate = true;
    E.forEach((e, k) => {
      const v = hi < 0 ? .28 : (e[0] == hi || e[1] == hi ? 1 : .07);
      lc.fill(v, k * 6, k * 6 + 6);
    });
    lg.attributes.color.needsUpdate = true;
  }
  paint();

  // ---------- 4. CAMERA ----------
  const V3 = THREE.Vector3;
  const dirV = new V3();
  let T = null, Dfit = 0;

  const fit = () => {
    Dfit = Rm * 2.1 / (Math.tan(25 * Math.PI / 180) * Math.max(.3, innerWidth / innerHeight));
  };
  fit();

  // keeps the camera between "whole model fits" and "just past the far side"
  const cz = z => Math.min(G.position.z + Dfit * 1.05, Math.max(G.position.z - Rm - 30, z));

  // smooth move to a target rotation, model position and camera position
  const go = (q, gp, cp) => {
    T = { q0: G.quaternion.clone(), g0: G.position.clone(), c0: cam.position.clone(), q, gp, cp, t: 0 };
  };
  const home = () => go(
    new THREE.Quaternion().setFromEuler(new THREE.Euler(.35, 0, 0)),
    new V3(),
    new V3(0, 0, Dfit)
  );
  G.quaternion.setFromEuler(new THREE.Euler(.35, 0, 0));
  cam.position.set(0, 0, Dfit);

  function tween() {
    if (!T) return;
    T.t = Math.min(1, T.t + .03);
    const e = T.t * T.t * (3 - 2 * T.t);
    G.quaternion.copy(T.q0).slerp(T.q, e);
    G.position.lerpVectors(T.g0, T.gp, e);
    cam.position.lerpVectors(T.c0, T.cp, e);
    if (T.t == 1) T = null;
  }

  // slide the model so the dot is centred, then fly the camera in close
  const fly = n => go(
    G.quaternion.clone(),
    new V3(n.x, n.y + (narrow() ? -10 : 0), n.z).applyQuaternion(G.quaternion).negate(),
    new V3(0, 0, 60)
  );

  const zoom = d => {
    T = null;
    cam.getWorldDirection(dirV);
    cam.position.addScaledVector(dirV, d);
    cam.position.z = cz(cam.position.z);
  };
  $('B').onclick = home;
  $('zi').onclick = () => zoom(60);
  $('zo').onclick = () => zoom(-60);

  // ---------- 5. PANELS ----------
  const row = (k, a, b = '') =>
    `<div class="r" data-k="${esc(k)}"><span>${esc(a)}</span><span>${esc(b)}</span></div>`;

  // most recent releases (ties at 3rd place all show; capped at 10 rows)
  const rec = fs =>
    rank(fs.filter(f => f.n), f => f.n, f => f.title)
      .slice(0, 10)
      .map(f => row('n' + f.node.i, f.title, f.y))
      .join('') || '<div style="opacity:.6">None dated yet</div>';

  let all = false;   // languages list: top 3 or all

  function left() {
    const ls = [...LG.values()].sort((a, b) => b.fs.length - a.fs.length || a.name.localeCompare(b.name));
    const sh = all ? ls : rank(ls, l => l.fs.length, l => l.name);
    const tp = t => rank(P[t], n => n.f.length, n => n.name)
      .slice(0, 10)
      .map(n => row('n' + n.i, n.name, n.f.length))
      .join('');

    $('L').innerHTML = `
      <div class="t">
        <h1>${esc(CFG.title)}</h1>
        <div class="big">${F.length}</div>
        <div>Films watched</div>
        <div class="q">${esc(CFG.quote)}</div>
      </div>
      <div class="o">
        <h2>Most recent releases watched</h2>${rec(F)}
        <h2>Languages</h2>${sh.map(l => row('l' + l.k, l.name, l.fs.length)).join('')}
        ${ls.length > sh.length || all ? `<div class="r" data-k="more"><span>${all ? 'See less' : 'See all ' + ls.length}</span></div>` : ''}
        <h2>Most watched directors</h2>${tp(0)}
        <h2>Most watched actors</h2>${tp(2)}
      </div>`;
  }
  left();

  // moves the zoom buttons left of the right panel when it grows tall
  const adj = () => {
    const R = $('R');
    $('Z').classList.toggle('sh',
      !narrow() && R.classList.contains('on') && R.getBoundingClientRect().bottom > innerHeight - 64);
  };

  const pl = (n, w) => `${n} ${w}${n == 1 ? '' : 's'}`;

  function right(h) {
    $('R').innerHTML = `<div class="r" data-k="x" style="float:right">×</div>` + h;
    $('R').scrollTop = 0;
    $('R').classList.add('on');
    document.body.classList.add('det');
    adj();
  }

  function show(i) {
    const n = N[i];
    if (n.t == 1) {
      const f = n.film;
      right(`
        <h1>${esc(f.title)}</h1>
        <div>${esc(f.y)}${f.lang ? ' · ' + esc(f.lang) : ''}</div>
        <h2>${f.dirs.length > 1 ? 'Directors' : 'Director'}</h2>${f.dirs.map(p => row('n' + p.i, p.name)).join('')}
        <h2>Cast</h2>${f.cast.map(p => row('n' + p.i, p.name)).join('')}`);
    } else {
      right(`
        <h1>${esc(n.name)}</h1>
        <div>${pl(n.f.length, 'film')} of ${esc(n.name)} so far</div>
        <h2>Recent films watched</h2>${rec(n.f)}`);
    }
  }

  function sel(i, f) {
    hi = i;
    paint();
    show(i);
    if (f) fly(N[i]);
  }

  function clr() {
    hi = -1;
    paint();
    $('R').classList.remove('on');
    document.body.classList.remove('det');
    adj();
  }

  function lang(k) {
    hi = -1;
    paint();
    const l = LG.get(k);
    right(`
      <h1>${esc(l.name)}</h1>
      <div>${l.fs.length} ${esc(l.name)} ${l.fs.length == 1 ? 'film' : 'films'} watched so far</div>
      <h2>Recent films watched</h2>${rec(l.fs)}`);
  }

  // one click handler for every name, title and language in the panels and search
  document.addEventListener('click', e => {
    const r = e.target.closest('[data-k]');
    if (!r) return;
    const k = r.dataset.k;
    if (k == 'more') { all = !all; left(); }
    else if (k == 'x') clr();
    else if (k[0] == 'l') lang(k.slice(1));
    else sel(+k.slice(1), true);
    if (r.closest('#res')) {
      $('res').innerHTML = '';
      $('q').value = '';
    }
  });

  // ---------- 6. SEARCH ----------
  $('q').oninput = e => {
    const q = nz(e.target.value.trim());
    if (!q) { $('res').innerHTML = ''; return; }
    const g = (h, a) => a.length ? `<h2>${h}</h2>` + a.slice(0, 8).join('') : '';
    $('res').innerHTML =
      g('Films', F.filter(f => nz(f.title).includes(q)).map(f => row('n' + f.node.i, f.title, f.y))) +
      g('Directors', P[0].filter(n => nz(n.name).includes(q)).map(n => row('n' + n.i, n.name))) +
      g('Cast', P[2].filter(n => nz(n.name).includes(q)).map(n => row('n' + n.i, n.name))) +
      g('Languages', [...LG.values()].filter(l => nz(l.name).includes(q)).map(l => row('l' + l.k, l.name)));
  };

  // ---------- 7. MOUSE AND TOUCH ----------
  // drag = rotate model, right-drag or Shift-drag = pan, wheel = fly toward cursor
  const rc = new THREE.Raycaster();
  const mo = new THREE.Vector2();
  const cv = ren.domElement;
  let dn = null;

  const ray = (x, y) => {
    mo.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
    rc.setFromCamera(mo, cam);
  };

  cv.oncontextmenu = e => e.preventDefault();

  cv.onpointerdown = e => {
    dn = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, pan: e.button == 2 || e.shiftKey, mv: 0 };
    cv.setPointerCapture(e.pointerId);
    T = null;
  };

  cv.onpointermove = e => {
    if (!dn) return;
    const dx = e.clientX - dn.x, dy = e.clientY - dn.y;
    dn.x = e.clientX;
    dn.y = e.clientY;
    if (Math.hypot(e.clientX - dn.x0, e.clientY - dn.y0) > 5) dn.mv = 1;   // small moves count as a click
    if (!dn.mv) return;
    if (dn.pan) {
      const k = cam.position.distanceTo(G.position) * .0016;
      G.position.x += dx * k;
      G.position.y -= dy * k;
    } else {
      const qy = new THREE.Quaternion().setFromAxisAngle(new V3(0, 1, 0), dx * .005);
      const qx = new THREE.Quaternion().setFromAxisAngle(new V3(1, 0, 0), dy * .005);
      G.quaternion.premultiply(qy).premultiply(qx);
    }
  };

  cv.onpointerup = e => {
    if (dn && !dn.mv) {                       // a click, not a drag
      cam.updateMatrixWorld();
      G.updateMatrixWorld();
      ray(e.clientX, e.clientY);
      const h = rc.intersectObject(im)[0];
      h ? sel(h.instanceId, false) : clr();
    }
    dn = null;
  };

  addEventListener('wheel', e => {
    if (e.target.closest('.p,#S')) return;    // scrolling a panel should not zoom
    e.preventDefault();
    T = null;
    ray(e.clientX, e.clientY);
    cam.position.addScaledVector(rc.ray.direction, -e.deltaY * .6);
    cam.position.z = cz(cam.position.z);
  }, { passive: false });

  addEventListener('resize', () => {
    cam.aspect = innerWidth / innerHeight;
    cam.updateProjectionMatrix();
    ren.setSize(innerWidth, innerHeight);
    fit();
    adj();
  });

  // ---------- 8. LABELS ----------
  // the 160 nearest dots get a name that fades with distance; layer names sit at plane edges
  const lb = [...Array(160)].map(() => {
    const d = document.createElement('div');
    d.className = 'lb';
    $('lbs').append(d);
    return d;
  });
  const ly = ['Directors', 'Movies', 'Cast'].map(t => {
    const d = document.createElement('div');
    d.className = 'lb ly';
    d.textContent = t;
    $('lbs').append(d);
    return d;
  });

  const lv = N.map(n => new V3(n.x, n.y, n.z));
  const w = new V3();
  const ds = new Float32Array(N.length);
  const idx = N.map((_, i) => i);

  const place = (el, x, y, o) => {
    el.style.opacity = o;
    el.style.transform = `translate(${x}px,${y}px) translate(-50%,-130%)`;
  };

  function labels() {
    cam.updateMatrixWorld();
    G.updateMatrixWorld();

    for (let i = 0; i < N.length; i++) {
      ds[i] = w.copy(lv[i]).applyMatrix4(G.matrixWorld).distanceTo(cam.position);
    }
    idx.sort((a, b) => ds[a] - ds[b]);

    lb.forEach((el, k) => {
      const i = idx[k], d = ds[i];
      if (i === undefined) { el.style.opacity = 0; return; }
      w.copy(lv[i]).applyMatrix4(G.matrixWorld).project(cam);
      const o = w.z > 1 ? 0 :
        Math.max(0, Math.min(1, 1 - (d - 150) / 500)) *    // fade when far
        Math.max(0, Math.min(1, (d - 20) / 30));            // fade when very close
      const t = N[i].t == 1 ? `${N[i].film.title} (${N[i].film.y})` : N[i].name;
      if (el.textContent !== t) el.textContent = t;
      place(el, (w.x + 1) / 2 * innerWidth, (1 - w.y) / 2 * innerHeight, o);
    });

    ly.forEach((el, t) => {
      w.set(Rd[t] + 14, Y[t], 0).applyMatrix4(G.matrixWorld).project(cam);
      place(el, (w.x + 1) / 2 * innerWidth, (1 - w.y) / 2 * innerHeight, w.z > 1 ? 0 : 1);
    });
  }

  // ---------- 9. START ----------
  (function loop() {
    requestAnimationFrame(loop);
    tween();
    labels();
    ren.render(sc, cam);
  })();
}
</script>
</body>
</html>
